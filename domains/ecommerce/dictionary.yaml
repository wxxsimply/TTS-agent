metrics:
  sales:
    label: 销售额
    definition: 排除取消订单后，订单金额 total_amount 的合计
    synonyms: [销售额, 成交额, 营收, revenue]
    format: currency
    unit: 美元
  average_order_value:
    label: 平均客单价
    definition: 有效订单销售额除以有效订单数
    synonyms: [客单价, 平均订单金额, AOV]
    format: currency
    unit: 美元
  repeat_purchase_rate:
    label: 复购率
    definition: 统计期内下单两次及以上客户数除以下单客户总数
    synonyms: [复购率, 重复购买率]
    format: percent
    unit: "%"
  conversion_rate:
    label: 转化率
    definition: converted 为真的访问会话数除以访问会话总数
    synonyms: [转化率, 下单转化率]
    format: percent
    unit: "%"
  advertising_roi:
    label: 广告 ROI
    definition: 广告带来的销售额除以广告花费；当前数据没有订单与广告活动的直接归因关系时必须说明限制
    synonyms: [广告ROI, 投产比, 广告回报率]
    format: decimal
