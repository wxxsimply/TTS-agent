name: tts-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    pids_limit: 200
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    pids_limit: 100
    logging: *default-logging

  backend:
    image: tts-agent-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_READONLY_URL: postgres://agent_readonly:readonly_secret@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DOMAINS_PATH: /app/domains
      PORT: "8000"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 320m
    pids_limit: 200
    logging: *default-logging

  worker:
    image: tts-agent-backend:latest
    command: ["/app/worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_READONLY_URL: postgres://agent_readonly:readonly_secret@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      DOMAINS_PATH: /app/domains
      TZ: Asia/Shanghai
      WORKER_CONCURRENCY: "1"
      WORKER_USER_CONCURRENCY: "1"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 320m
    pids_limit: 200
    logging: *default-logging

  frontend:
    image: tts-agent-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    pids_limit: 100
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
